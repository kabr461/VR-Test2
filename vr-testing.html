<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VR Test Rig — WebXR Laser + Resolution Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
<style>
  :root {
    --bg: #05070a;
    --panel: #0c1016;
    --panel-line: #1c2530;
    --cyan: #35e0ff;
    --amber: #ffb545;
    --text: #e8edf2;
    --text-dim: #6b7684;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Inter', sans-serif; overflow: hidden; }
  a-scene { width: 100%; height: 100%; }

  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 24px; box-sizing: border-box;
    background: linear-gradient(180deg, rgba(5,7,10,0.92) 0%, rgba(5,7,10,0) 100%);
    pointer-events: none;
  }
  #topbar .brand { display: flex; align-items: baseline; gap: 10px; pointer-events: auto; }
  #topbar .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  #topbar h1 { color: var(--text); font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.04em; text-transform: uppercase; }
  #topbar .sub { color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 3px; }

  #launchBtn {
    pointer-events: auto;
    background: var(--cyan); color: #04141a; border: none; border-radius: 6px;
    padding: 12px 24px; font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
    cursor: pointer; font-family: 'Inter', sans-serif;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 0 0 0 rgba(53,224,255,0);
  }
  #launchBtn:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(53,224,255,0.35); }
  #launchBtn:active { transform: translateY(0); }

  #loadOverlay {
    position: fixed; inset: 0; z-index: 30; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    transition: opacity 0.4s ease;
  }
  #loadOverlay.hidden { opacity: 0; pointer-events: none; }
  #loadOverlay .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--panel-line); border-top-color: var(--cyan);
    animation: spin 0.8s linear infinite;
  }
  #loadOverlay p { color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .clickable, .drag-track { cursor: pointer; }

  #desktopControls {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px; box-sizing: border-box;
    background: linear-gradient(0deg, rgba(5,7,10,0.95) 0%, rgba(5,7,10,0) 100%);
    font-family: 'Inter', sans-serif;
  }
  #desktopControls.hidden { display: none; }
  #desktopControls button {
    background: #151c26; border: 1px solid #1c2530; color: var(--text);
    border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    font-family: 'Inter', sans-serif; flex-shrink: 0;
  }
  #desktopControls button:hover { background: #1c2530; border-color: var(--cyan); }
  #desktopControls input[type="range"] {
    flex: 1; accent-color: var(--cyan); cursor: pointer;
  }
  #desktopControls .volWrap input[type="range"] { width: 90px; flex: none; }
  #desktopControls select {
    background: #151c26; border: 1px solid #1c2530; color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 12px; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace; flex-shrink: 0;
  }
  #desktopControls label { color: var(--text-dim); font-size: 11px; font-family: 'IBM Plex Mono', monospace; flex-shrink: 0; }
</style>
</head>
<body>

<div id="loadOverlay"><div class="ring"></div><p>INITIALIZING SCENE…</p></div>

<div id="topbar">
  <div class="brand">
    <div class="dot"></div>
    <div>
      <h1>VR Test Rig</h1>
      <div class="sub">webxr · laser + drag + resolution diagnostics · grip toggles panel</div>
    </div>
  </div>
  <button id="launchBtn">Enter VR</button>
</div>

<div id="desktopControls">
  <button id="dtPlayPause">Play</button>
  <input id="dtSeek" type="range" min="0" max="1000" value="0">
  <div class="volWrap">
    <label>VOL</label>
    <input id="dtVolume" type="range" min="0" max="100" value="100">
  </div>
  <label>RES</label>
  <select id="dtQuality"></select>
</div>

<a-scene xr-mode-ui="enabled: false" vr-mode-ui="enabled: false" background="color: #05070a">

  <a-assets timeout="10000">
    <video id="video360"
      src="https://cdn.aframe.io/360-video-boilerplate/video/city.mp4"
      crossorigin="anonymous" loop playsinline webkit-playsinline muted>
    </video>
  </a-assets>

  <!--
    Higher segment count than A-Frame's default sphere primitive.
    Low segment counts are a common cause of "wavy"/warping equirect video —
    the mesh facets become visible as you rotate, especially near the poles.
    This does NOT fix bitrate/compression artifacts — that's a source-encode
    problem, not a renderer problem.
  -->
  <a-videosphere id="videoSphere" src="#video360" rotation="0 -90 0"
    segments-height="64" segments-width="128">
  </a-videosphere>

  <a-entity id="rig" position="0 1.6 0">
    <a-camera id="camera" look-controls wasd-controls>
      <a-cursor
        id="mouseCursor"
        drag-interaction
        raycaster="objects: .clickable, .drag-track; far: 20"
        cursor="rayOrigin: mouse; fuse: false"
        geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.013"
        material="color: #35e0ff; shader: flat">
      </a-cursor>
    </a-camera>
  </a-entity>

  <a-entity id="leftHand"
    laser-controls="hand: left"
    raycaster="objects: .clickable, .drag-track; far: 20"
    line="color: #35e0ff; opacity: 0.9"
    drag-interaction>
  </a-entity>

  <a-entity id="rightHand"
    laser-controls="hand: right"
    raycaster="objects: .clickable, .drag-track; far: 20"
    line="color: #ffb545; opacity: 0.9"
    drag-interaction>
  </a-entity>

  <!--
    HUD: no timer-based auto-hide anywhere in this file. It stays visible
    by default and only toggles on an explicit grip-button press (see
    toggleHud() below) — never disappears on its own while you're testing.
  -->
  <a-entity id="hud" position="0 1.5 -2.3">

    <a-plane class="panel-bg" width="2.1" height="1.72" color="#0c1016" opacity="0.94" material="shader: flat"></a-plane>
    <a-plane width="2.1" height="0.005" color="#35e0ff" opacity="0.6" position="0 0.858 0.001" material="shader: flat"></a-plane>

    <a-text value="VR TEST RIG // CONTROL PANEL" position="-0.94 0.76 0.01" width="2.6" color="#35e0ff" align="left" font="sourcecodepro"></a-text>

    <!-- Play / Pause -->
    <a-entity id="playPauseBtn" class="clickable"
      geometry="primitive: plane; width: 0.55; height: 0.15"
      material="color: #151c26; shader: flat"
      position="-0.66 0.56 0.01">
      <a-plane width="0.55" height="0.008" color="#35e0ff" position="0 -0.075 0.001" material="shader: flat"></a-plane>
      <a-text value="PLAY / PAUSE" align="center" position="0 0 0.01" width="1.7" color="#e8edf2"></a-text>
    </a-entity>

    <a-entity id="muteBtn" class="clickable"
      geometry="primitive: plane; width: 0.55; height: 0.15"
      material="color: #151c26; shader: flat"
      position="0.02 0.56 0.01">
      <a-plane width="0.55" height="0.008" color="#ffb545" position="0 -0.075 0.001" material="shader: flat"></a-plane>
      <a-text id="muteLabel" value="MUTE" align="center" position="0 0 0.01" width="1.7" color="#e8edf2"></a-text>
    </a-entity>

    <a-text value="RESOLUTION" position="-0.94 0.4 0.01" width="1.6" color="#6b7684" font="sourcecodepro"></a-text>

    <!-- Resolution menu: proper list, not a 2-way toggle. Swap the src map in
         the script below for your real bitrate ladder — the wiring/UI stays
         identical no matter how many rungs the ladder has. -->
    <a-entity id="qualityMenu" position="0 0.28 0.01"></a-entity>

    <a-text value="SEEK" position="-0.94 -0.02 0.01" width="1.6" color="#6b7684" font="sourcecodepro"></a-text>
    <a-entity id="seekTrack" class="drag-track" data-type="seek" data-width="1.88"
      geometry="primitive: plane; width: 1.88; height: 0.05"
      material="color: #151c26; shader: flat"
      position="0 -0.1 0.01">
      <a-plane id="seekFill" width="0.01" height="0.05" color="#35e0ff" position="-0.94 0 0.005" material="shader: flat"></a-plane>
      <a-entity id="seekHandle" class="handle"
        geometry="primitive: circle; radius: 0.042; segments: 20"
        material="color: #35e0ff; shader: flat"
        position="-0.94 0 0.02">
      </a-entity>
    </a-entity>

    <a-text value="VOLUME" position="-0.94 -0.28 0.01" width="1.6" color="#6b7684" font="sourcecodepro"></a-text>
    <a-entity id="volumeTrack" class="drag-track" data-type="volume" data-width="1.88"
      geometry="primitive: plane; width: 1.88; height: 0.05"
      material="color: #151c26; shader: flat"
      position="0 -0.36 0.01">
      <a-plane id="volumeFill" width="0.01" height="0.05" color="#ffb545" position="-0.94 0 0.005" material="shader: flat"></a-plane>
      <a-entity id="volumeHandle" class="handle"
        geometry="primitive: circle; radius: 0.042; segments: 20"
        material="color: #ffb545; shader: flat"
        position="0.19 0 0.02">
      </a-entity>
    </a-entity>

    <!-- Debug log -->
    <a-plane width="2.1" height="0.5" color="#05070a" position="0 -0.6 0.005" material="shader: flat"></a-plane>
    <a-plane width="2.1" height="0.005" color="#1c2530" position="0 -0.358 0.006" material="shader: flat"></a-plane>
    <a-text id="debugLog" value="rig ready." position="-0.94 -0.42 0.02" width="1.55" color="#4ade80" line-height="32" baseline="top" font="sourcecodepro"></a-text>

  </a-entity>

</a-scene>

<script>
(function () {
  var video = document.querySelector('#video360');
  var debugEl = document.querySelector('#debugLog');
  var muteLabel = document.querySelector('#muteLabel');
  var logLines = [];

  // Real resolution ladder config. Two distinct public sample assets are
  // wired here to prove the swap mechanism end-to-end; replace `src` with
  // your actual per-rung URLs (e.g. CDN-hosted 480p/720p/1080p/4K variants
  // of the SAME clip) and everything else keeps working unchanged.
  var QUALITY_LADDER = [
    { id: 'auto', label: 'AUTO',  src: 'https://cdn.aframe.io/360-video-boilerplate/video/city.mp4' },
    { id: '1080', label: '1080P', src: 'https://cdn.aframe.io/360-video-boilerplate/video/city.mp4' },
    { id: '480',  label: '480P',  src: 'https://cdn.bitmovin.com/content/assets/playhouse-vr/progressive.mp4' }
  ];
  var activeQuality = QUALITY_LADDER[0].id;

  function log(msg) {
    var stamp = new Date().toLocaleTimeString();
    logLines.push('[' + stamp + '] ' + msg);
    if (logLines.length > 7) logLines.shift();
    if (debugEl) debugEl.setAttribute('value', logLines.join('\n'));
    console.log('[VR TEST]', msg);
  }

  // ---- Loading overlay ----
  var sceneEl = document.querySelector('a-scene');
  sceneEl.addEventListener('loaded', function () {
    document.querySelector('#loadOverlay').classList.add('hidden');
    log('Scene loaded.');
  });

  // ---- Launch VR: only enabled if this device/browser genuinely supports
  // a real immersive-vr WebXR session (Quest browser, or a PC with the
  // headset paired via Link/Air Link). Plain desktop Chrome with no XR
  // runtime attached does NOT get this button — it just gets the normal
  // 2D controls, no fake tilted 3D fallback view.
  var launchBtn = document.querySelector('#launchBtn');
  launchBtn.disabled = true;
  launchBtn.textContent = 'Checking device…';

  function checkXrSupport() {
    if (!navigator.xr || !navigator.xr.isSessionSupported) return Promise.resolve(false);
    return navigator.xr.isSessionSupported('immersive-vr').catch(function () { return false; });
  }

  checkXrSupport().then(function (supported) {
    if (supported) {
      launchBtn.disabled = false;
      launchBtn.textContent = 'Enter VR';
      log('immersive-vr supported. Enter VR enabled.');
    } else {
      launchBtn.style.display = 'none';
      log('No immersive-vr device detected — desktop controls only.');
    }
  });

  launchBtn.addEventListener('click', function () {
    if (sceneEl.is('vr-mode')) sceneEl.exitVR(); else sceneEl.enterVR();
  });
  sceneEl.addEventListener('enter-vr', function () {
    launchBtn.textContent = 'Exit VR';
    log('Entered immersive VR session.');
  });
  sceneEl.addEventListener('exit-vr', function () {
    launchBtn.textContent = 'Enter VR';
    log('Exited immersive VR session.');
  });

  // ---- HUD show/hide, controlled only by the grip button, never by a timer ----
  var hud = document.querySelector('#hud');
  var hudVisible = false;
  hud.setAttribute('visible', false);
  function toggleHud() {
    hudVisible = !hudVisible;
    hud.setAttribute('visible', hudVisible);
    log('HUD ' + (hudVisible ? 'shown' : 'hidden') + ' (grip)');
  }
  document.querySelector('#leftHand').addEventListener('gripdown', toggleHud);
  document.querySelector('#rightHand').addEventListener('gripdown', toggleHud);

  // Desktop control bar only makes sense outside an immersive session —
  // hide it the moment VR starts, bring it back when VR ends.
  var desktopControls = document.querySelector('#desktopControls');
  sceneEl.addEventListener('enter-vr', function () { desktopControls.classList.add('hidden'); });
  sceneEl.addEventListener('exit-vr', function () { desktopControls.classList.remove('hidden'); });

  // ---- Play / Pause (shared: 3D button + desktop button + video events) ----
  var dtPlayPause = document.querySelector('#dtPlayPause');
  function togglePlay(source) {
    if (video.paused) { video.play(); log('CLICK: Play (' + source + ')'); }
    else { video.pause(); log('CLICK: Pause (' + source + ')'); }
  }
  document.querySelector('#playPauseBtn').addEventListener('click', function () { togglePlay('3D'); });
  dtPlayPause.addEventListener('click', function () { togglePlay('desktop'); });
  video.addEventListener('play', function () { dtPlayPause.textContent = 'Pause'; });
  video.addEventListener('pause', function () { dtPlayPause.textContent = 'Play'; });

  // ---- Mute (shared) ----
  var dtVolume = document.querySelector('#dtVolume');
  function toggleMute(source) {
    video.muted = !video.muted;
    muteLabel.setAttribute('value', video.muted ? 'UNMUTE' : 'MUTE');
    log('CLICK: ' + (video.muted ? 'Muted' : 'Unmuted') + ' (' + source + ')');
  }
  document.querySelector('#muteBtn').addEventListener('click', function () { toggleMute('3D'); });

  // ---- Desktop seek + volume ----
  var dtSeek = document.querySelector('#dtSeek');
  var seekingFromUI = false;
  dtSeek.addEventListener('input', function () {
    seekingFromUI = true;
    if (video.duration) video.currentTime = (dtSeek.value / 1000) * video.duration;
  });
  video.addEventListener('timeupdate', function () {
    if (!seekingFromUI && video.duration) dtSeek.value = (video.currentTime / video.duration) * 1000;
    seekingFromUI = false;
  });
  dtVolume.addEventListener('input', function () {
    video.volume = dtVolume.value / 100;
    if (video.volume > 0 && video.muted) { video.muted = false; muteLabel.setAttribute('value', 'MUTE'); }
    log('Desktop volume -> ' + dtVolume.value + '%');
  });

  // ---- Hover feedback on all clickable buttons ----
  function wireHover(el, baseColor) {
    el.addEventListener('mouseenter', function () { el.setAttribute('material', 'color', '#232e3d'); });
    el.addEventListener('mouseleave', function () { el.setAttribute('material', 'color', baseColor); });
  }

  // ---- Build resolution menu from QUALITY_LADDER: both 3D buttons and the
  // desktop <select>, driven off the same array and same switchQuality() ----
  var qualityMenu = document.querySelector('#qualityMenu');
  var dtQuality = document.querySelector('#dtQuality');
  var btnWidth = 0.6, gap = 0.04;
  var totalWidth = QUALITY_LADDER.length * btnWidth + (QUALITY_LADDER.length - 1) * gap;
  var startX = -totalWidth / 2 + btnWidth / 2;

  QUALITY_LADDER.forEach(function (rung, i) {
    var opt = document.createElement('option');
    opt.value = rung.id;
    opt.textContent = rung.label;
    dtQuality.appendChild(opt);

    var btn = document.createElement('a-entity');
    btn.classList.add('clickable', 'quality-btn');
    btn.dataset.qualityId = rung.id;
    btn.setAttribute('geometry', 'primitive: plane; width: ' + btnWidth + '; height: 0.13');
    btn.setAttribute('material', 'color: #151c26; shader: flat');
    btn.setAttribute('position', (startX + i * (btnWidth + gap)) + ' 0 0.01');

    var underline = document.createElement('a-plane');
    underline.setAttribute('width', btnWidth);
    underline.setAttribute('height', '0.007');
    underline.setAttribute('color', rung.id === activeQuality ? '#35e0ff' : '#2a3542');
    underline.setAttribute('position', '0 -0.068 0.001');
    underline.setAttribute('material', 'shader: flat');
    underline.classList.add('quality-underline');
    btn.appendChild(underline);

    var label = document.createElement('a-text');
    label.setAttribute('value', rung.label);
    label.setAttribute('align', 'center');
    label.setAttribute('position', '0 0 0.01');
    label.setAttribute('width', '1.7');
    label.setAttribute('color', rung.id === activeQuality ? '#35e0ff' : '#e8edf2');
    label.setAttribute('font', 'sourcecodepro');
    btn.appendChild(label);

    btn.addEventListener('click', function () {
      switchQuality(rung, '3D');
    });
    wireHover(btn, '#151c26');

    qualityMenu.appendChild(btn);
  });

  dtQuality.addEventListener('change', function () {
    var rung = QUALITY_LADDER.filter(function (r) { return r.id === dtQuality.value; })[0];
    if (rung) switchQuality(rung, 'desktop');
  });

  function switchQuality(rung, source) {
    var wasPlaying = !video.paused;
    var t = video.currentTime;
    video.src = rung.src;
    video.load();
    video.addEventListener('loadedmetadata', function onLoaded() {
      video.currentTime = Math.min(t, video.duration || t);
      if (wasPlaying) video.play();
      video.removeEventListener('loadedmetadata', onLoaded);
    });
    activeQuality = rung.id;
    dtQuality.value = rung.id;
    document.querySelectorAll('.quality-btn').forEach(function (b) {
      var on = b.dataset.qualityId === rung.id;
      b.querySelector('a-text').setAttribute('color', on ? '#35e0ff' : '#e8edf2');
      b.querySelector('.quality-underline').setAttribute('color', on ? '#35e0ff' : '#2a3542');
    });
    log('CLICK: resolution -> ' + rung.label + ' (' + source + ')');
  }

  // ---- Continuous drag interaction (seek + volume) ----
  AFRAME.registerComponent('drag-interaction', {
    init: function () {
      this.dragging = false;
      this.dragTarget = null;
      this.onDown = this.onDown.bind(this);
      this.onUp = this.onUp.bind(this);
      this.onIntersection = this.onIntersection.bind(this);
      this.el.addEventListener('triggerdown', this.onDown);
      this.el.addEventListener('mousedown', this.onDown);
      this.el.addEventListener('triggerup', this.onUp);
      this.el.addEventListener('mouseup', this.onUp);
      this.el.addEventListener('raycaster-intersection', this.onIntersection);
    },
    onDown: function () {
      var raycaster = this.el.components.raycaster;
      if (!raycaster || !raycaster.intersections.length) return;
      var targetEl = raycaster.intersections[0].object.el;
      if (targetEl && targetEl.classList.contains('drag-track')) {
        this.dragging = true;
        this.dragTarget = targetEl;
        log('DRAG start: ' + targetEl.id);
        this.applyFromIntersection(raycaster.intersections[0]);
      }
    },
    onUp: function () {
      if (this.dragging && this.dragTarget) log('DRAG end: ' + this.dragTarget.id);
      this.dragging = false;
      this.dragTarget = null;
    },
    onIntersection: function (evt) {
      if (!this.dragging || !this.dragTarget) return;
      var match = evt.detail.intersections.filter(function (i) {
        return i.object.el === this.dragTarget;
      }.bind(this))[0];
      if (!match) return;
      this.applyFromIntersection(match);
    },
    applyFromIntersection: function (intersection) {
      var trackEl = this.dragTarget;
      var width = parseFloat(trackEl.getAttribute('data-width')) || 1.88;
      var localPoint = trackEl.object3D.worldToLocal(intersection.point.clone());
      var t = Math.min(1, Math.max(0, (localPoint.x + width / 2) / width));

      var handle = trackEl.querySelector('.handle');
      if (handle) handle.setAttribute('position', { x: -width / 2 + t * width, y: 0, z: 0.02 });

      if (trackEl.dataset.type === 'seek') {
        var fill = document.querySelector('#seekFill');
        if (fill) { fill.setAttribute('width', Math.max(0.01, t * width)); fill.setAttribute('position', { x: -width / 2 + (t * width) / 2, y: 0, z: 0.005 }); }
        if (video.duration) video.currentTime = t * video.duration;
      } else if (trackEl.dataset.type === 'volume') {
        var vfill = document.querySelector('#volumeFill');
        if (vfill) { vfill.setAttribute('width', Math.max(0.01, t * width)); vfill.setAttribute('position', { x: -width / 2 + (t * width) / 2, y: 0, z: 0.005 }); }
        video.volume = t;
        video.muted = false;
        muteLabel.setAttribute('value', 'MUTE');
      }
    }
  });

  log('Click PLAY/MUTE, drag SEEK/VOLUME, or pick a resolution rung to test.');
})();
</script>

</body>
</html>
